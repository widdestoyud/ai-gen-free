# Jalur kanonik: copy .env.example → .env, lalu docker compose up --build
# DATABASE_URL / STORAGE_* (Cloudflare R2) / SMTP_* (Sumopod) / SIRAY_* dari .env (ADR 0012).
# Postgres Docker opsional: docker compose --profile postgres up --build

services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file: .env
    environment:
      DATABASE_URL: ${DIRECT_URL:-${DATABASE_URL}}
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${WORKER_DATABASE_URL:-${DATABASE_URL}}
      STORAGE_ENDPOINT: ${WORKER_STORAGE_ENDPOINT:-${STORAGE_ENDPOINT}}
      WORKER_HEALTH_PORT: "3002"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      SIRAY_LOG_DIR: /app/logs/siray
      CHAOS_PAUSE_AFTER_SUCCESS_MS: ${CHAOS_PAUSE_AFTER_SUCCESS_MS:-0}
    volumes:
      - ./logs/siray:/app/logs/siray
    expose:
      - "3002"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-32-bytes-min}
      AUTH_TRUST_HOST: "true"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-32-bytes-min}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:-admin}
      ADMIN_BASIC_PASSWORD: ${ADMIN_BASIC_PASSWORD:-change-me}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
