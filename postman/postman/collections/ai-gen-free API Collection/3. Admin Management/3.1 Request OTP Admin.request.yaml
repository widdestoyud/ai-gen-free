$kind: http-request
description: Meminta OTP masuk admin. Wajib menyertakan Header Authorization Basic.
url: "{{baseUrl}}/api/admin/auth/otp/request"
method: POST
headers:
  Content-Type: application/json
  Authorization: Basic {{adminBasicAuthBase64}}
body:
  type: text
  content: |-
    {
      "email": "{{adminEmail}}"
    }
order: 1000
