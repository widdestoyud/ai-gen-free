$kind: http-request
description: Mengubah durasi cooldown generator global (misalnya menjadi 3600 detik = 1 jam).
url: "{{baseUrl}}/admin/settings/generate_cooldown_seconds"
method: PUT
headers:
  Content-Type: application/json
  Cookie: sid_admin={{adminSessionToken}}
body:
  type: text
  content: |-
    {
      "value": 3600
    }
order: 5000
