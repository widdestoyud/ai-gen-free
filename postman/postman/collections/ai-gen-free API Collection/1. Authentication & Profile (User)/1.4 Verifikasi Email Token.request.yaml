$kind: http-request
description: Memverifikasi token email. Wajib POST JSON body { token }. Jangan kirim token sebagai query param.
url: "{{baseUrl}}/auth/email-validation"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{emailVerificationToken}}"
    }
order: 4000
