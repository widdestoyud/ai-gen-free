$kind: http-request
description: "Login menggunakan email dan password. Jika login pertama kali atau terdeteksi ganti perangkat, mengembalikan requiresOtp: true dan mengirim kode OTP ke email."
url: "{{baseUrl}}/user/login"
method: POST
headers:
  Content-Type: application/json
  x-device-id: device-desktop-chrome-v1
body:
  type: text
  content: |-
    {
      "email": "user.test123@gmail.com",
      "password": "ValidPassword123!",
      "deviceId": "device-desktop-chrome-v1"
    }
order: 5000
