$kind: http-request
description: Mengganti password, consume token, mencabut seluruh sesi. Password lemah → A011.
url: "{{baseUrl}}/auth/password-reset-confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{passwordResetToken}}",
      "password": "NewValidPass123"
    }
order: 13000
