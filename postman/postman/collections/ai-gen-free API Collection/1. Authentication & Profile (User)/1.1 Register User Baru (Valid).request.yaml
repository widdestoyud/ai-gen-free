$kind: http-request
description: Mendaftar akun baru dengan email whitelist (@gmail.com, @yahoo.com, @ymail.com) dan password minimal 8 karakter (>=1 huruf kapital, >=1 angka).
url: "{{baseUrl}}/user/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user.test123@gmail.com",
      "password": "ValidPassword123!"
    }
order: 1000
